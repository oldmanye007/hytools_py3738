
name: Build Documentation

on:
  push:
    #branches: [ main ]
    tags: [ 'v*' ]
  #pull_request:
  #  branches: [ main, master ]

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip' # Automatically caches installed dependencies

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          # Install Sphinx and the Read the Docs theme
          pip install sphinx sphinx-rtd-theme myst-parser
          # If you use a requirements file for docs, uncomment below:
          # pip install -r docs/requirements.txt

      - name: Build HTML Documentation
        run: |
          # Change directory to where your Makefile / conf.py resides (usually 'docs')
          #cd docs/source/
          # Run the Sphinx build command to catch any compilation errors
          sphinx-build -b html docs/source/ docs/_build/html

      - name: Save HTML output
        uses: actions/upload-artifact@v4
        with:
          name: html-docs
          path: docs/_build/html/