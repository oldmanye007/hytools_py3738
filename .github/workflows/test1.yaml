name: Run Python Tests and Save Output

on: [push, pull_request]


jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10']

    steps:
    # 1. Fetch your code from the repository
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Set up the Python environment
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    # 3. Install your test dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    # 4. Run tests and pipe the terminal output to a file
    # The 'if: always()' ensures the log saves even if tests fail
    - name: Run tests and redirect output
      if: always()
      run: |
        pytest -s -v > test_report.txt 2>&1

    # 5. Upload the file to GitHub so you can download it
    - name: Upload test results file
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: python-test-output
        path: test_report.txt