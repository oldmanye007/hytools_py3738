name: Run Python Tests and Save Output

on: 
#[push, pull_request]
  workflow_dispatch: # Enables the manual trigger button


jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9','3.10','3.11','3.12']

    steps:
    # 1. Fetch your code from the repository
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Set up the Python environment
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    # 3. Install your test dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build pytest

    - name: Build package artifacts
      run: python -m build

    - name: Install built wheel
      # Installs the generated .whl file from the dist/ folder
      run: python -m pip install dist/*.whl


    # 4. Run tests and pipe the terminal output to a file
    # The 'if: always()' ensures the log saves even if tests fail    
    - name: Run tests against installed package
      if: always()
      # Moving to a temporary directory forces Python to import the 
      # globally installed package instead of the local source files.
      run: |
          mkdir test_env
          cd test_env
          pytest -s -v ../tests  > ../test_report.txt 2>&1


    # 5. Upload the file to GitHub so you can download it
    - name: Upload test results file
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: python-test-output
        path: test_report.txt